[package]
name = "video-trimmer"
version = "0.1.0"
edition = "2018"
license = "GPL-3.0-or-later"

[dependencies]
nom = "6.1.2"
futures-util = "0.3.14"
once_cell = "1.7.2"
mime_guess = "2.0.3"
futures-channel = "0.3.14"
log = "0.4.14"
gtk = { package = "gtk4", version = "0.2.0" }
glib = { version = "0.14.5", features = ["log", "log_macros"] }
adw = { package = "libadwaita", version = "0.1.0-alpha-3" }
json = "0.12.4"

[dependencies.gettext-rs]
version = "0.7.0"
features = ["gettext-system"]
