[package]
name = "video-trimmer"
version = "0.1.0"
edition = "2018"
license = "GPL-3.0-or-later"

[dependencies]
nom = "5.1.1"
futures-util = "0.3.5"
once_cell = "1.4.0"
mime_guess = "2.0.3"

[dependencies.gstreamer]
version = "0.16.0"
features = ["v1_10"]

[dependencies.gtk]
version = "0.9.0"
features = ["v3_24"]

[dependencies.gdk]
version = "0.13.0"
features = ["v3_24"]

[dependencies.gio]
version = "0.9.0"
# v2_44 required by gtk v3_16
features = ["v2_44"]

[dependencies.glib]
version = "0.10.0"
# v2_44 required by gio v2_44
features = ["v2_44"]

[dependencies.gettext-rs]
version = "0.4.4"
features = ["gettext-system"]
