[package]
name = "video-trimmer"
version = "0.1.0"
edition = "2018"
license = "GPL-3.0-or-later"

[dependencies]
env_logger = "0.7.1"
log = "0.4.8"
nom = "5.1.1"
futures-util = "0.3.4"
once_cell = "1.3.1"
mime_guess = "2.0.3"
gstreamer = "0.15.4"

[dependencies.gtk]
version = "0.8.1"
features = ["v3_24"]

[dependencies.gdk]
version = "0.12.1"
features = ["v3_24"]

[dependencies.gio]
version = "0.8.1"
features = ["v2_60"]

[dependencies.glib]
version = "0.9.2"
features = ["v2_60"]

[dependencies.gettext-rs]
version = "0.4.4"
features = ["gettext-system"]
