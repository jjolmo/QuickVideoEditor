[package]
name = "video-trimmer"
version = "0.1.0"
edition = "2018"
license = "GPL-3.0-or-later"

[dependencies]
adw = { version = "0.5.3", package = "libadwaita", features = ["v1_2"] }
ashpd = { version = "0.6.2", features = ["gtk4"] }
futures-channel = "0.3.28"
futures-util = "0.3.28"
gettext-rs = { version = "0.7.0", features = ["gettext-system"] }
glib = { version = "0.18.2", features = ["log", "log_macros"] }
gtk = { version = "0.7.3", package = "gtk4" }
json = "0.12.4"
log = "0.4.20"
mime_guess = "2.0.4"
nom = "7.1.3"
once_cell = "1.18.0"
