[package]
name = "video-trimmer"
version = "0.1.0"
edition = "2018"
license = "GPL-3.0-or-later"

[dependencies]
env_logger = "0.7.1"
log = "0.4.8"
nom = "5.1.1"
futures-util = "0.3.5"
once_cell = "1.4.0"
mime_guess = "2.0.3"

[dependencies.gstreamer]
git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs.git"
features = ["v1_10"]

[patch.'https://github.com/gtk-rs/sys']
glib-sys = "0.10.0"
gobject-sys = "0.10.0"

[patch.'https://github.com/gtk-rs/glib']
glib = "0.10.0"

[dependencies.gtk]
version = "0.9.0"
features = ["v3_24"]

[dependencies.gdk]
version = "0.13.0"
features = ["v3_24"]

[dependencies.gio]
version = "0.9.0"
features = ["v2_60"]

[dependencies.glib]
version = "0.10.0"
features = ["v2_60"]

[dependencies.gettext-rs]
version = "0.4.4"
features = ["gettext-system"]
