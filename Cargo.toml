[package]
name = "video-trimmer"
version = "0.1.0"
edition = "2018"
license = "GPL-3.0-or-later"

[dependencies]
nom = "6.1.2"
futures-util = "0.3.14"
once_cell = "1.7.2"
mime_guess = "2.0.3"
futures-channel = "0.3.14"
log = "0.4.14"
gtk = { git = "https://github.com/gtk-rs/gtk4-rs.git", package = "gtk4" }
glib = { git = "https://github.com/gtk-rs/gtk-rs.git", features = ["log", "log_macros"] }
adw = { git = "https://gitlab.gnome.org/World/Rust/libadwaita-rs.git", package = "libadwaita" }

[dependencies.gettext-rs]
version = "0.7.0"
features = ["gettext-system"]
